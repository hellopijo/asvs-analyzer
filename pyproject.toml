[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asvs-analyzer"
version = "0.1.0"
description = "Evidence-driven OWASP ASVS applicability scoping assistant"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "rich>=13.9,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Reserved for the later crawl/report milestones.
crawl = ["playwright>=1.48,<2", "httpx>=0.27,<1"]
report = ["openpyxl>=3.1,<4"]

[project.scripts]
asvs-analyzer = "asvs_analyzer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
